<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Citas | SM MasterNails</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <h1 class="mb-3">Citas agendadas</h1>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

   
    <form th:action="@{/citas}" method="get" class="d-flex gap-2 mb-3">
        <input type="search" name="buscar" th:value="${buscar}" class="form-control"
               placeholder="Buscar por nombre del cliente">
        <button type="submit" class="btn btn-outline-secondary">Buscar</button>
    </form>

    <a th:href="@{/citas/nueva}" class="btn btn-primary mb-3">Agendar cita</a>

    <table class="table table-striped align-middle">
        <thead>
            <tr>
                <th>ID</th><th>Cliente</th><th>Servicio</th>
                <th>Fecha</th><th>Hora</th><th>Acciones</th>
            </tr>
        </thead>
        <tbody>
           
            <tr th:each="cita : ${citas}">
                <td th:text="${cita.idCita}"></td>
                <td th:text="${cita.cliente?.nombreCompleto}"></td>
                <td th:text="${cita.servicio?.nombre}"></td>
                <td th:text="${cita.fecha}"></td>
                <td th:text="${#temporals.format(cita.hora, 'HH:mm')}"></td>
                <td class="d-flex gap-2">
                    <a th:href="@{/citas/editar/{id}(id=${cita.idCita})}"
                       class="btn btn-sm btn-warning">Editar</a>
                    <form th:action="@{/citas/eliminar/{id}(id=${cita.idCita})}" method="post"
                          onsubmit="return confirm('¿Cancelar esta cita?');">
                        <button type="submit" class="btn btn-sm btn-danger">Cancelar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(citas)}">
                <td colspan="6" class="text-center">No hay citas registradas.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
