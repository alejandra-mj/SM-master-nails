<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de cita | SM MasterNails</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4" style="max-width: 600px;">
    <h1 class="mb-3">Solicitar una cita</h1>

    <form th:action="@{/citas/guardar}" th:object="${cita}" method="post">
      
        <input type="hidden" th:field="*{idCita}">

        
        <div class="mb-3">
            <label class="form-label">Cliente</label>
            <select name="idCliente" class="form-select">
                <option value="">Selecciona...</option>
                <option th:each="c : ${clientes}"
                        th:value="${c.idCliente}"
                        th:text="${c.nombreCompleto}"
                        th:selected="${cita.cliente != null and cita.cliente.idCliente == c.idCliente}">
                </option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('cliente')}"
                 th:errors="*{cliente}"></div>
        </div>

        
        <div class="mb-3">
            <label class="form-label">Servicio</label>
            <select name="idServicio" class="form-select">
                <option value="">Selecciona...</option>
                <option th:each="s : ${servicios}"
                        th:value="${s.idServicio}"
                        th:text="${s.nombre}"
                        th:selected="${cita.servicio != null and cita.servicio.idServicio == s.idServicio}">
                </option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('servicio')}"
                 th:errors="*{servicio}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha</label>
            <input type="date" th:field="*{fecha}" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('fecha')}"
                 th:errors="*{fecha}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Hora</label>
            <input type="time" th:field="*{hora}" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('hora')}"
                 th:errors="*{hora}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/citas}" class="btn btn-secondary">Volver</a>
    </form>
</body>
</html>
